server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: enterprise-knowledge-rag
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_rag}
    username: ${POSTGRES_USER:rag}
    password: ${POSTGRES_PASSWORD:rag_local_password}
  flyway:
    enabled: true
  ai:
    model:
      chat: ${AI_CHAT_ENABLED:none}
      embedding: ${AI_EMBEDDING_ENABLED:none}
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:disabled}
      chat:
        timeout: ${AI_CHAT_TIMEOUT:30s}
        max-retries: 0
        options:
          model: ${AI_CHAT_MODEL:gpt-4.1-mini}
          temperature: 0.1
      embedding:
        timeout: ${AI_EMBEDDING_TIMEOUT:20s}
        max-retries: 0
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
        index-type: HNSW
        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

rag:
  streaming:
    timeout: ${RAG_STREAM_TIMEOUT:120s}
    chunk-characters: ${RAG_STREAM_CHUNK_CHARACTERS:24}
    core-threads: ${RAG_STREAM_CORE_THREADS:2}
    max-threads: ${RAG_STREAM_MAX_THREADS:8}
    queue-capacity: ${RAG_STREAM_QUEUE_CAPACITY:50}
  security:
    jwt:
      issuer: ${RAG_JWT_ISSUER:enterprise-knowledge-rag}
      secret: ${RAG_JWT_SECRET}
  ai-resilience:
    max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
    retry-wait: ${AI_RETRY_WAIT:500ms}
    failure-rate-threshold: ${AI_CIRCUIT_FAILURE_RATE:50}
    sliding-window-size: ${AI_CIRCUIT_WINDOW_SIZE:10}
    minimum-number-of-calls: ${AI_CIRCUIT_MIN_CALLS:5}
    open-state-wait: ${AI_CIRCUIT_OPEN_WAIT:30s}
  audit:
    model-name: ${AI_CHAT_MODEL:gpt-4.1-mini}
    prompt-version: ${RAG_PROMPT_VERSION:v1}
  conversation:
    history-limit: ${RAG_HISTORY_LIMIT:10}
    max-history-characters: ${RAG_MAX_HISTORY_CHARACTERS:4000}
  answer:
    max-context-characters: ${RAG_MAX_CONTEXT_CHARACTERS:12000}
  embedding:
    dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    batch-size: ${AI_EMBEDDING_BATCH_SIZE:32}
  chunk:
    size: 700
    overlap: 120
  retrieval:
    vector-top-k: 20
    keyword-top-k: 20
    final-top-k: 5
    min-score: 0.35
    rrf-k: 60
  prompt:
    active-version: ${RAG_PROMPT_VERSION:v1}
  nacos:
    enabled: ${NACOS_ENABLED:false}
    server-address: ${NACOS_SERVER_ADDR:localhost:8848}
    data-id: enterprise-knowledge-rag.yaml
    group: DEFAULT_GROUP

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    com.aishare.knowledgerag: INFO
